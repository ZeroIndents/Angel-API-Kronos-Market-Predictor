<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kronos View</title>
<link rel="stylesheet" href="/styles.css?v=17">
</head>
<body>
  <!-- ======================= Top toolbar (minimal) ====================== -->
  <div class="tv-toolbar">
    <div class="tv-group" id="tf-group">
      <label class="tv-label">TIMEFRAME</label>
      <div class="tv-btnrow" id="tf-buttons">
        <button class="tv-btn tv-btn-sm" data-tf="1m">1m</button>
        <button class="tv-btn tv-btn-sm tv-btn-active" data-tf="5m">5m</button>
        <button class="tv-btn tv-btn-sm" data-tf="15m">15m</button>
        <button class="tv-btn tv-btn-sm" data-tf="30m">30m</button>
        <button class="tv-btn tv-btn-sm" data-tf="1H">1H</button>
        <button class="tv-btn tv-btn-sm" data-tf="1D">1D</button>
      </div>
    </div>

    <div class="tv-sep"></div>

    <div class="tv-group" id="range-group">
      <label class="tv-label">RANGE</label>
      <div class="tv-btnrow" id="range-buttons">
        <button class="tv-btn tv-btn-sm" data-range="1D">1D</button>
        <button class="tv-btn tv-btn-sm tv-btn-active" data-range="5D">5D</button>
        <button class="tv-btn tv-btn-sm" data-range="1M">1M</button>
        <button class="tv-btn tv-btn-sm" data-range="3M">3M</button>
        <button class="tv-btn tv-btn-sm" data-range="6M">6M</button>
        <button class="tv-btn tv-btn-sm" data-range="1Y">1Y</button>
        <button class="tv-btn tv-btn-sm" data-range="5Y">5Y</button>
      </div>
    </div>

    <div class="tv-sep"></div>

    <div class="tv-group" id="type-group">
      <label class="tv-label">TYPE</label>
      <div class="tv-btnrow" id="type-buttons">
        <button class="tv-btn tv-btn-sm tv-btn-active" data-charttype="candles" title="Candlestick chart">Candles</button>
        <button class="tv-btn tv-btn-sm tv-btn-active" id="vol-btn" title="Toggle the volume histogram">Vol</button>
      </div>
    </div>

    <div class="tv-spacer"></div>

    <div class="tv-group">
      <button class="tv-btn" id="auto-btn" title="Auto-predict the upcoming candles as live data updates">🔮 Auto</button>
      <button class="tv-btn tv-btn-accent" id="kronos-btn" title="Run the local Kronos AI forecast on the active chart">
        🔮 Kronos AI
      </button>
      <button class="tv-btn tv-btn-sm" id="reset-btn" title="Reset the chart to the default view - recent candles (Alt+R)">⟲</button>
      <button class="tv-btn tv-btn-sm" id="screenshot-btn" title="Download a PNG screenshot of the active chart">📸</button>
      <button class="tv-btn tv-btn-sm" id="fullscreen-btn" title="Toggle fullscreen on the active chart">⛶</button>
    </div>
    <div class="tv-badge" id="source-badge">source: —</div>
    <div class="tv-badge" id="market-badge">—</div>
    <div class="tv-badge" id="ws-badge">ws: —</div>
  </div>

  <!-- ======================= Main row: chart grid ======================== -->
  <div id="tv-main">
    <div id="chart-grid" class="layout-1"></div>
  </div>

  <!-- ======================= Status bar ================================== -->
  <div class="tv-statusbar">
    <span id="st-symbol">—</span>
    <span id="st-interval">—</span>
    <span id="st-candles">0 candles</span>
    <span id="st-depth">—</span>
    <span class="tv-spacer2"></span>
    <span id="st-clock">—</span>
    <span id="st-hint">Click a chart to focus · right-click = chart actions · Ctrl+K search · Alt+R resets zoom · Alt+S screenshot · ↑/↓ switch symbols · scroll left = older candles</span>
  </div>

  <div id="toast-stack"></div>

  <!-- lightweight-charts v5.2 — bundled locally for offline / fast startup -->
  <script src="/lightweight-charts.standalone.production.js"></script>
  <!-- ?v= cache-buster: the server sends no-store, but a hard refresh
       (Ctrl+Shift+R) or a new tab is still the reliable way to pick up
       a fresh bundle if your browser has cached an older app.js. -->
  <script src="/app.js?v=31"></script>
</body>
</html>
